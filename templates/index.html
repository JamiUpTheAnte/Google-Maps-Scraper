<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelp Lead Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            background: #f7f9fc;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status-box.show {
            display: block;
        }

        .status-box h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-queued {
            background: #ffd93d;
            color: #8b6f00;
        }

        .status-running {
            background: #667eea;
            color: white;
        }

        .status-completed {
            background: #51cf66;
            color: white;
        }

        .status-failed {
            background: #ff6b6b;
            color: white;
        }

        .results-info {
            margin-top: 15px;
        }

        .results-info p {
            margin: 5px 0;
        }

        .download-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .download-btn {
            background: #51cf66;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #40c057;
        }

        .jobs-link {
            text-align: center;
            margin-top: 20px;
        }

        .jobs-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: inline-block;
            transition: background 0.3s;
        }

        .jobs-link a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Yelp Lead Scraper</h1>
            <p>Extract business leads from Yelp with custom search criteria</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">New Scraping Job</h2>
            <form id="scrapeForm">
                <div class="form-group">
                    <label for="category">Business Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="general contractors"
                        placeholder="e.g., plumbers, electricians, roofers"
                        required
                    >
                    <div class="input-hint">The type of business to search for on Yelp</div>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        value="Atlanta, GA"
                        placeholder="e.g., New York, NY or Dallas, TX"
                        required
                    >
                    <div class="input-hint">City and state to search in</div>
                </div>

                <div class="form-group">
                    <label for="num_results">Number of Results</label>
                    <input
                        type="number"
                        id="num_results"
                        name="num_results"
                        value="50"
                        min="1"
                        max="100"
                        required
                    >
                    <div class="input-hint">How many businesses to scrape (1-100)</div>
                </div>

                <button type="submit" id="submitBtn">
                    🚀 Start Scraping
                </button>
            </form>

            <div id="statusBox" class="status-box">
                <h3>Job Status</h3>
                <div id="statusContent"></div>
            </div>
        </div>

        <div class="jobs-link">
            <a href="/jobs">📋 View All Jobs</a>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let statusCheckInterval = null;

        document.getElementById('scrapeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const statusContent = document.getElementById('statusContent');

            // Get form data
            const formData = {
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                num_results: parseInt(document.getElementById('num_results').value)
            };

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div> Creating job...';

            try {
                // Start scraping job
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    currentJobId = data.job_id;
                    statusBox.classList.add('show');

                    // Start checking status
                    checkStatus();
                    statusCheckInterval = setInterval(checkStatus, 3000);
                } else {
                    alert('Error: ' + data.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '🚀 Start Scraping';
                }
            } catch (error) {
                alert('Error starting job: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '🚀 Start Scraping';
            }
        });

        async function checkStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/status/${currentJobId}`);
                const data = await response.json();

                if (data.success) {
                    displayStatus(data);

                    // Stop checking if completed or failed
                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(statusCheckInterval);
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').innerHTML = '🚀 Start Scraping';
                    }
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function displayStatus(data) {
            const statusContent = document.getElementById('statusContent');
            let html = `
                <div class="status-badge status-${data.status}">${data.status.toUpperCase()}</div>
                <p><strong>Job ID:</strong> ${data.job_id}</p>
                <p><strong>Category:</strong> ${data.category}</p>
                <p><strong>Location:</strong> ${data.location}</p>
                <p><strong>Num Results:</strong> ${data.num_results}</p>
            `;

            if (data.status === 'running') {
                html += `<p><div class="spinner"></div> Scraping in progress...</p>`;
            }

            if (data.status === 'completed' && data.stats) {
                html += `
                    <div class="results-info">
                        <h4>Results:</h4>
                        <p>✅ Total Leads: ${data.stats.total}</p>
                        <p>🌐 With Websites: ${data.stats.with_websites}</p>
                        <p>📧 With Emails: ${data.stats.with_emails}</p>
                        <p>📱 With Phones: ${data.stats.with_phones}</p>
                    </div>
                    <div class="download-buttons">
                        <a href="${data.download_csv_url}" class="download-btn">📥 Download CSV</a>
                        <a href="${data.download_json_url}" class="download-btn">📥 Download JSON</a>
                    </div>
                `;
            }

            if (data.status === 'failed' && data.error) {
                html += `<p style="color: #ff6b6b;"><strong>Error:</strong> ${data.error}</p>`;
            }

            statusContent.innerHTML = html;
        }
    </script>
</body>
</html>
