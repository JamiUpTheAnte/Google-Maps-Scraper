<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs - Yelp Lead Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .back-link {
            text-align: center;
            margin-bottom: 20px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: inline-block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .jobs-list {
            margin-top: 20px;
        }

        .job-item {
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .job-item:hover {
            border-color: #667eea;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-queued {
            background: #ffd93d;
            color: #8b6f00;
        }

        .status-running {
            background: #667eea;
            color: white;
        }

        .status-completed {
            background: #51cf66;
            color: white;
        }

        .status-failed {
            background: #ff6b6b;
            color: white;
        }

        .job-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .job-detail {
            font-size: 0.9em;
        }

        .job-detail strong {
            color: #333;
        }

        .download-btn {
            background: #51cf66;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-size: 0.9em;
            font-weight: 600;
            margin-right: 10px;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 All Jobs</h1>
            <p>View and download results from all scraping jobs</p>
        </div>

        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>

        <div class="card">
            <button class="refresh-btn" onclick="loadJobs()">🔄 Refresh</button>

            <div id="jobsList" class="jobs-list">
                <div class="empty-state">Loading jobs...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadJobs() {
            const jobsList = document.getElementById('jobsList');
            jobsList.innerHTML = '<div class="empty-state">Loading jobs...</div>';

            try {
                const response = await fetch('/api/jobs');
                const data = await response.json();

                if (data.success && data.jobs.length > 0) {
                    jobsList.innerHTML = data.jobs.map(job => renderJob(job)).join('');
                } else {
                    jobsList.innerHTML = '<div class="empty-state">No jobs found</div>';
                }
            } catch (error) {
                jobsList.innerHTML = '<div class="empty-state">Error loading jobs</div>';
                console.error('Error loading jobs:', error);
            }
        }

        function renderJob(job) {
            const createdDate = new Date(job.created_at).toLocaleString();

            let html = `
                <div class="job-item">
                    <div class="job-header">
                        <h3>${job.category} in ${job.location}</h3>
                        <div class="status-badge status-${job.status}">${job.status.toUpperCase()}</div>
                    </div>

                    <div class="job-details">
                        <div class="job-detail">
                            <strong>Job ID:</strong> ${job.job_id.substring(0, 8)}...
                        </div>
                        <div class="job-detail">
                            <strong>Created:</strong> ${createdDate}
                        </div>
                        <div class="job-detail">
                            <strong>Num Results:</strong> ${job.num_results}
                        </div>
                    </div>
            `;

            if (job.status === 'completed' && job.result && job.result.stats) {
                html += `
                    <div style="background: #f7f9fc; padding: 15px; border-radius: 6px; margin-top: 10px;">
                        <strong>Results:</strong>
                        Total: ${job.result.stats.total} |
                        With Websites: ${job.result.stats.with_websites} |
                        With Emails: ${job.result.stats.with_emails} |
                        With Phones: ${job.result.stats.with_phones}
                    </div>
                    <div>
                        <a href="/api/download/${job.job_id}/csv" class="download-btn">📥 Download CSV</a>
                        <a href="/api/download/${job.job_id}/json" class="download-btn">📥 Download JSON</a>
                    </div>
                `;
            }

            if (job.status === 'failed' && job.error) {
                html += `
                    <div style="color: #ff6b6b; margin-top: 10px;">
                        <strong>Error:</strong> ${job.error}
                    </div>
                `;
            }

            html += `</div>`;
            return html;
        }

        // Load jobs on page load
        loadJobs();

        // Auto-refresh every 5 seconds
        setInterval(loadJobs, 5000);
    </script>
</body>
</html>
